[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# IMPORTANT: do not override with a custom startCommand that runs prisma
# without logging — Dockerfile CMD uses ./start.sh (verbose + timeout).
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
