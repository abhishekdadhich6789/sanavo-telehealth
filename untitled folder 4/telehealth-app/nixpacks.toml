# Railway Nixpacks — no Docker required
[phases.setup]
nixPkgs = ["nodejs_22", "python311", "gcc", "gnumake"]

[phases.install]
cmds = ["npm ci || npm install"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "mkdir -p /data && npx prisma db push --accept-data-loss && npx next start -H 0.0.0.0 -p ${PORT:-3000}"
